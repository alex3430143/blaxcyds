name: Feature request
description: Suggest a capability or improvement for BLAXCY
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the goal you are trying to accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like BLAXCY to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Body (real input)
        - Eye (perception)
        - Brain (models)
        - Policy / safety
        - Recovery
        - Tools (terminal / filesystem / browser / delegation)
        - Memory / learning
        - Supervisor / IPC
        - GUI / CLI
        - Installation / packaging
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Does this touch real input, policy, auth boundaries, or untrusted content?
    validations:
      required: false
