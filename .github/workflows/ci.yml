name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: python -m pip install --upgrade pip ruff
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n upgrade.sh
          bash -n uninstall.sh
      - name: Python syntax and error-only lint
        run: |
          python -m compileall -q blaxcy tests
          ruff check --select E9,F63,F7,F82 blaxcy tests

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr xvfb
      - name: Install BLAXCY
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          # Every optional feature degrades safely, so a missing wheel for one
          # extra must never fail the whole run.
          for extra in control ui vision security browser; do
            python -m pip install -e ".[${extra}]" \
              || echo "::warning::optional extra '${extra}' was not installed"
          done
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a python -m pytest -q
